<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Card</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 340px;
            background: #b3c8ff;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            padding-bottom: 40px;
        }

        .card::before,
        .card::after {
            content: '';
            position: absolute;
            background: #85a3ff;
            border-radius: 50%;
            opacity: 0.25;
            z-index: 1;
        }

        .card::before {
            width: 180px;
            height: 180px;
            bottom: -60px;
            left: -40px;
        }

        .card::after {
            width: 120px;
            height: 120px;
            bottom: -30px;
            right: -30px;
        }

        .image-container {
            position: relative;
            z-index: 2;
            padding: 28px 28px 20px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 24px;
            display: block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 0 32px;
            text-align: left;
        }

        .content h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1e2937;
            line-height: 1.1;
        }

        .highlight {
            display: inline-block;
            background: #4f6df5;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 9999px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="image-container">
            <img src="img.png" alt="Man holding notebook">
        </div>
        <div class="content">
            <h2>Track your<br>expenses</h2>
        </div>
    </div>
</body>
</html>
