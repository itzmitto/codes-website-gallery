<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailwind Colors</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 60px 40px 120px;
  }

  header {
    text-align: center;
    max-width: 640px;
    margin: 0 auto 50px;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0 0 16px;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 6px 0;
  }

  .grid-wrapper {
    max-width: 1200px;
    margin: 0 auto;
  }

  .shade-labels {
    display: grid;
    grid-template-columns: 110px repeat(11, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }

  .shade-labels span {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
  }

  .color-row {
    display: grid;
    grid-template-columns: 110px repeat(11, 1fr);
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }

  .row-label {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text);
  }

  .swatch {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.12s ease;
  }

  .swatch:hover {
    transform: scale(1.06);
    z-index: 5;
  }

  .tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: #1e293b;
    color: #f8fafc;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    letter-spacing: 0.02em;
  }

  .tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #1e293b;
  }

  .swatch:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .copy-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: #1e293b;
    color: #f8fafc;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
    letter-spacing: 0.01em;
  }

  .copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 900px) {
    .shade-labels, .color-row {
      grid-template-columns: 70px repeat(11, 1fr);
      gap: 6px;
    }
    h1 { font-size: 1.8rem; }
    body { padding: 40px 16px 80px; }
  }

  @media (max-width: 600px) {
    .shade-labels span { font-size: 0.65rem; }
    .row-label { font-size: 0.78rem; }
  }
</style>
</head>
<body>

<div class="copy-toast" id="copyToast"></div>

<header>
  <h1>Tailwind Colors</h1>
  <p>Explore all Tailwind CSS v4 colors. Hover to see the hex code, click to copy.</p>
</header>

<div class="grid-wrapper">
  <div class="shade-labels">
    <span></span>
    <span>50</span><span>100</span><span>200</span><span>300</span><span>400</span>
    <span>500</span><span>600</span><span>700</span><span>800</span><span>900</span><span>950</span>
  </div>
  <div id="colorGrid"></div>
</div>

<script>
  const shades = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];

  const colors = {
    Red:     ["#fef2f2","#fee2e2","#fecaca","#fca5a5","#f87171","#ef4444","#dc2626","#b91c1c","#991b1b","#7f1d1d","#450a0a"],
    Orange:  ["#fff7ed","#ffedd5","#fed7aa","#fdba74","#fb923c","#f97316","#ea580c","#c2410c","#9a3412","#7c2d12","#431407"],
    Amber:   ["#fffbeb","#fef3c7","#fde68a","#fcd34d","#fbbf24","#f59e0b","#d97706","#b45309","#92400e","#78350f","#451a03"],
    Yellow:  ["#fefce8","#fef9c3","#fef08a","#fde047","#facc15","#eab308","#ca8a04","#a16207","#854d0e","#713f12","#422006"],
    Lime:    ["#f7fee7","#ecfccb","#d9f99d","#bef264","#a3e635","#84cc16","#65a30d","#4d7c0f","#3f6212","#365314","#1a2e05"],
    Green:   ["#f0fdf4","#dcfce7","#bbf7d0","#86efac","#4ade80","#22c55e","#16a34a","#15803d","#166534","#14532d","#052e16"],
    Emerald: ["#ecfdf5","#d1fae5","#a7f3d0","#6ee7b7","#34d399","#10b981","#059669","#047857","#065f46","#064e3b","#022c22"],
    Teal:    ["#f0fdfa","#ccfbf1","#99f6e4","#5eead4","#2dd4bf","#14b8a6","#0d9488","#0f766e","#115e59","#134e4a","#042f2e"],
    Cyan:    ["#ecfeff","#cffafe","#a5f3fc","#67e8f9","#22d3ee","#06b6d4","#0891b2","#0e7490","#155e75","#164e63","#083344"],
    Sky:     ["#f0f9ff","#e0f2fe","#bae6fd","#7dd3fc","#38bdf8","#0ea5e9","#0284c7","#0369a1","#075985","#0c4a6e","#082f49"],
    Blue:    ["#eff6ff","#dbeafe","#bfdbfe","#93c5fd","#60a5fa","#3b82f6","#2563eb","#1d4ed8","#1e40af","#1e3a8a","#172554"],
    Indigo:  ["#eef2ff","#e0e7ff","#c7d2fe","#a5b4fc","#818cf8","#6366f1","#4f46e5","#4338ca","#3730a3","#312e81","#1e1b4b"],
    Violet:  ["#f5f3ff","#ede9fe","#ddd6fe","#c4b5fd","#a78bfa","#8b5cf6","#7c3aed","#6d28d9","#5b21b6","#4c1d95","#2e1065"],
    Purple:  ["#faf5ff","#f3e8ff","#e9d5ff","#d8b4fe","#c084fc","#a855f7","#9333ea","#7e22ce","#6b21a8","#581c87","#3b0764"],
    Fuchsia: ["#fdf4ff","#fae8ff","#f5d0fe","#f0abfc","#e879f9","#d946ef","#c026d3","#a21caf","#86198f","#701a75","#4a044e"],
    Pink:    ["#fdf2f8","#fce7f3","#fbcfe8","#f9a8d4","#f472b6","#ec4899","#db2777","#be185d","#9d174d","#831843","#500724"],
    Rose:    ["#fff1f2","#ffe4e6","#fecdd3","#fda4af","#fb7185","#f43f5e","#e11d48","#be123c","#9f1239","#881337","#4c0519"],
    Slate:   ["#f8fafc","#f1f5f9","#e2e8f0","#cbd5e1","#94a3b8","#64748b","#475569","#334155","#1e293b","#0f172a","#020617"],
    Gray:    ["#f9fafb","#f3f4f6","#e5e7eb","#d1d5db","#9ca3af","#6b7280","#4b5563","#374151","#1f2937","#111827","#030712"],
    Zinc:    ["#fafafa","#f4f4f5","#e4e4e7","#d4d4d8","#a1a1aa","#71717a","#52525b","#3f3f46","#27272a","#18181b","#09090b"],
    Neutral: ["#fafafa","#f5f5f5","#e5e5e5","#d4d4d4","#a3a3a3","#737373","#525252","#404040","#262626","#171717","#0a0a0a"],
    Stone:   ["#fafaf9","#f5f5f4","#e7e5e4","#d6d3d1","#a8a29e","#78716c","#57534e","#44403c","#292524","#1c1917","#0c0a09"],
  };

  const grid = document.getElementById("colorGrid");
  const toast = document.getElementById("copyToast");
  let toastTimeout;

  function showToast(hex) {
    toast.textContent = `${hex} copied!`;
    toast.classList.add("show");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 1500);
  }

  function renderGrid() {
    grid.innerHTML = "";

    Object.entries(colors).forEach(([name, hexValues]) => {
      const row = document.createElement("div");
      row.className = "color-row";

      const label = document.createElement("div");
      label.className = "row-label";
      label.textContent = name;
      row.appendChild(label);

      hexValues.forEach((hex) => {
        const swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.backgroundColor = hex;
        swatch.dataset.hex = hex;

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.textContent = hex;
        swatch.appendChild(tooltip);
        swatch.addEventListener("click", () => {
          navigator.clipboard.writeText(hex);
          showToast(hex);
        });

        row.appendChild(swatch);
      });

      grid.appendChild(row);
    });
  }

  renderGrid();
</script>

</body>
</html>
