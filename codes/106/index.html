<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Layout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="color-layout">
        <div class="block light top"></div>

        <div class="block blue big"></div>

        <div class="block pink top-right"></div>

        <div class="block pink right"></div>

        <div class="block dark dark-left"></div>

        <div class="block light middle"></div>

        <div class="block accent"></div>

        <div class="block pink left"></div>

        <div class="block light bottom-light"></div>

        <div class="block blue bottom-right"></div>

        <div class="block dark small-dark"></div>
      </section>
    </main>
  </body>
</html>
