<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ab-colors cards pagina</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="cards-grid">
        <div class="card expense-card">
            <div class="card__decoration"></div>
            <div class="card__image-wrap">
                <img src="img.png" alt="" class="card__image">
            </div>
            <p class="card__title">Track your<br>expenses</p>
        </div>

        <div class="card2">
            <h2>Expenses</h2>

            <div class="chart">
                <div class="donut">
                    <div class="hole">
                        <span>$ 14,919</span>
                    </div>
                </div>
            </div>

            <div class="list">
                <div class="row">
                    <div class="left">
                        <span class="dot dot1"></span>
                        <span>Groceries</span>
                    </div>
                    <div class="amount">$ 4,973</div>
                </div>
                <div class="row">
                    <div class="left">
                        <span class="dot dot2"></span>
                        <span>Household</span>
                    </div>
                    <div class="amount">$ 4,973</div>
                </div>
                <div class="row">
                    <div class="left">
                        <span class="dot dot3"></span>
                        <span>Travel</span>
                    </div>
                    <div class="amount">$ 4,973</div>
                </div>
            </div>
        </div>

        <div class="card expense-card expense-card2">
            <div class="card__decoration"></div>

            <div class="card__image-wrap2">
                <img src="image2.png" alt="" class="card__image2">
            </div>

            <p class="card__title">
                Track your<br>expenses
            </p>
        </div>


        <div class="card4">
            <div class="menu">
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-regular fa-user"></i>
                    <span>Customers</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-regular fa-bell"></i>
                    <span>Notifications</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-chart-simple"></i>
                    <span>Statistics</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-regular fa-message"></i>
                    <span>Chat</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </div>
        </div>



        <div class="card5">
            <img src="image2.png" alt="New Glasses" class="card5__image">

            <div class="card5__overlay"></div>

            <div class="card5__content">
                <h2>new<br>glasses</h2>

                <a href="#" class="card5__button">
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>




        <div class="card expense-card expense-card3">
            <div class="card__decoration"></div>

            <div class="card__image-wrap3">
                <img src="img.png" alt="" class="card__image">
            </div>

            <p class="card__title">
                Track your<br>expenses
            </p>
        </div>

        <div class="card"></div>
        <div class="card"></div>

        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>

        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>

        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>

        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>

    </div>

</body>

</html>
