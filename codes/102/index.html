<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Infinite Horizontal Scroll Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hero">
        <p class="eyebrow">portfolio project</p>
        <h1>crafting <span>digital</span>
        <br>experiences</h1>
    </div>
    <div class="carousel-wrapper">
        <div class="divider"><span>tech stack</span></div>
    
        <div class="carousel">
            <div class="track">
                <div class="item"><img src="./images/1.jpg" alt="1"></div>
                <div class="item"><img src="./images/2.jpg" alt="2"></div>
                <div class="item"><img src="./images/3.jpg" alt="3"></div>
                <div class="item"><img src="./images/4.jpg" alt="4"></div>
                <div class="item"><img src="./images/5.jpg" alt="5"></div>
                <div class="item"><img src="./images/6.jpg" alt="6"></div>
                <div class="item"><img src="./images/7.jpg" alt="7"></div>
            </div>
        </div>
    
    </div>
</body>
</html>
