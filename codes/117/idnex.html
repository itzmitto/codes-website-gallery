<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website</title>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo">Wandera</a>

      <nav class="main-nav">
        <a href="#">Destination</a>
        <a href="#">Travel plan</a>
        <a href="#">Inspiration</a>
        <a href="#">Shop</a>
        <a href="#">Blog</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Search</span>
        </button>
        <button class="btn btn-primary">Sign in</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-map" aria-hidden="true"></div>

      <div class="container hero-inner">
        <div class="hero-copy">
          <h1>Discover the<br>World's <span class="highlight">Hidden</span><br>Wonders</h1>
          <p>Find the unique moments and hidden gems that ignite unforgettable experiences. From rare encounters to remarkable destinations, we help you uncover the spark that turns every trip into a cherished story.</p>
          <button class="btn btn-dark">Plan your trip</button>
        </div>

        <div class="hero-gallery">
          <div class="img-card card-large">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
          </div>
          <div class="img-card card-small card-top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
          </div>
          <div class="img-card card-small card-bottom">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
          </div>
        </div>
      </div>
    </section>
  </main>
<style>
    :root {
  --color-text: #0d0a2e;
  --color-bg: #f6f4f4;
  --color-primary: #4040f5;
  --color-secondary: #ee0bd6;
  --color-accent: #c4c5ee;

  --font-display: 'Plus Jakarta Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 32px;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 999px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  padding: 12px 24px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: var(--color-text);
  color: var(--color-bg);
}

.btn-primary:hover {
  background: var(--color-primary);
}

.btn-dark {
  background: var(--color-text);
  color: #fff;
  padding: 14px 28px;
  font-size: 15px;
}

.btn-dark:hover {
  background: var(--color-primary);
  box-shadow: 0 8px 20px rgba(64, 64, 245, 0.25);
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text);
  cursor: pointer;
  opacity: 0.85;
}

.icon-btn:hover {
  opacity: 1;
  color: var(--color-primary);
}

.icon-btn svg {
  width: 17px;
  height: 17px;
}

/* ---------- Header ---------- */

.site-header {
  padding: 28px 0;
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.logo {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.02em;
}

.main-nav {
  display: flex;
  gap: 36px;
  font-size: 14.5px;
  font-weight: 500;
}

.main-nav a {
  opacity: 0.78;
  transition: opacity 0.15s ease, color 0.15s ease;
}

.main-nav a:hover {
  opacity: 1;
  color: var(--color-primary);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 24px;
}

/* ---------- Hero ---------- */

.hero {
  position: relative;
  overflow: hidden;
  padding-bottom: 100px;
}

.hero-map {
  position: absolute;
  inset: 0;
  top: -40px;
  background-image:
    radial-gradient(circle at 1px 1px, var(--color-accent) 1.4px, transparent 1.4px);
  background-size: 16px 16px;
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 600'><path fill='black' d='M120 180c40-30 90-20 120 10 20 20 20 50 50 60 40 15 70-25 110-15 35 9 40 50 75 60 45 13 80-30 125-20 30 7 35 40 65 48 50 13 95-45 145-30 25 8 25 38 50 48 60 24 120-50 180-25 20 8 15 35 35 45 55 27 110-40 165-15 18 8 10 33 28 42 45 22 90-30 130-8 22 12 12 35 32 47 35 21 75-15 105 5 18 12 8 30-2 42-25 30-70 18-95 45-15 16-5 38-20 55-25 28-65 15-90 40-12 12-5 30-18 42-30 28-75 10-105 38-13 12-5 30-18 42-35 32-85 12-118 45-10 10-5 25-15 36-110 0-220 0-330 0-12-0-22-9-22-21 0-50 0-100 0-150-30-10-55-32-65-62-10-30 0-65-20-90-25-32-70-30-98-58-20-20-15-50-35-70-22-22-55-20-78-42-18-18-12-42-28-62-22-28-58-22-82-48-15-17-8-38-22-55z'/></svg>");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: cover;
  -webkit-mask-position: center;
  mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 600'><path fill='black' d='M120 180c40-30 90-20 120 10 20 20 20 50 50 60 40 15 70-25 110-15 35 9 40 50 75 60 45 13 80-30 125-20 30 7 35 40 65 48 50 13 95-45 145-30 25 8 25 38 50 48 60 24 120-50 180-25 20 8 15 35 35 45 55 27 110-40 165-15 18 8 10 33 28 42 45 22 90-30 130-8 22 12 12 35 32 47 35 21 75-15 105 5 18 12 8 30-2 42-25 30-70 18-95 45-15 16-5 38-20 55-25 28-65 15-90 40-12 12-5 30-18 42-30 28-75 10-105 38-13 12-5 30-18 42-35 32-85 12-118 45-10 10-5 25-15 36-110 0-220 0-330 0-12-0-22-9-22-21 0-50 0-100 0-150-30-10-55-32-65-62-10-30 0-65-20-90-25-32-70-30-98-58-20-20-15-50-35-70-22-22-55-20-78-42-18-18-12-42-28-62-22-28-58-22-82-48-15-17-8-38-22-55z'/></svg>");
  mask-repeat: no-repeat;
  mask-size: cover;
  mask-position: center;
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}

.hero-inner {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 0.85fr;
  gap: 40px;
  align-items: center;
  padding-top: 40px;
}

.hero-copy h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 56px;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
}

.hero-copy .highlight {
  color: var(--color-primary);
}

.hero-copy p {
  font-size: 16px;
  line-height: 1.65;
  color: var(--color-text);
  opacity: 0.65;
  max-width: 440px;
  margin-bottom: 32px;
}

/* ---------- Gallery ---------- */

.hero-gallery {
  position: relative;
  height: 480px;
}

.img-card {
  position: absolute;
  background: var(--color-accent);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-primary);
  opacity: 0.55;
}

.img-card svg {
  width: 56px;
  height: 56px;
}

.card-large {
  width: 64%;
  height: 100%;
  left: 0;
  top: 0;
}

.card-small {
  width: 48%;
  height: 46%;
  right: 0;
}

.card-small svg {
  width: 38px;
  height: 38px;
}

.card-top {
  top: 0;
}

.card-bottom {
  bottom: 0;
}

/* ---------- Responsive ---------- */

@media (max-width: 980px) {
  .main-nav {
    display: none;
  }

  .hero-inner {
    grid-template-columns: 1fr;
  }

  .hero-gallery {
    height: 360px;
    order: -1;
  }

  .hero-copy h1 {
    font-size: 42px;
  }

  .hero-copy p {
    max-width: none;
  }
}

@media (max-width: 560px) {
  .container {
    padding: 0 20px;
  }

  .header-actions .icon-btn span {
    display: none;
  }

  .hero-copy h1 {
    font-size: 34px;
  }

  .hero-gallery {
    height: 280px;
  }
}
</style>
</body>
</html>
