<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <h1>
        Exercise
        <div class="tooltip-wrapper">
          <span class="help-icon" aria-label="Meer info">?</span>
          <div class="tooltip-box" role="tooltip">
            <p class="tooltip-title">Hulp nodig?</p>
            <p class="tooltip-text">
              Sleep de juiste code-blokken naar de lege vakken.
            </p>
          </div>
        </div>
      </h1>

      <p class="question" id="question-text"></p>

      <div class="code-block" id="code-block"></div>

      <div class="choices" id="choices"></div>

      <button class="submit-btn" onclick="checkAnswer()">
        Submit Answer »
      </button>
      <p class="feedback" id="feedback"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
