<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ab-colors website card voorbeeld1</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="card">
        <h2>Expenses</h2>
        <div class="chart">
            <svg width="260" height="260" viewBox="0 0 260 260">
                <circle cx="130" cy="130" r="85" fill="none" stroke="#22d3ee" stroke-width="26" stroke-linecap="round"
                    stroke-dasharray="166 534" transform="rotate(-90 130 130)" />
                <circle cx="130" cy="130" r="85" fill="none" stroke="#06b6d4" stroke-width="26" stroke-linecap="round"
                    stroke-dasharray="166 534" stroke-dashoffset="-184" transform="rotate(-90 130 130)" />
                <circle cx="130" cy="130" r="85" fill="none" stroke="#0891b2" stroke-width="26" stroke-linecap="round"
                    stroke-dasharray="166 534" stroke-dashoffset="-368" transform="rotate(-90 130 130)" />
            </svg>
            <div class="center-text">
                <span>$ 14,919</span>
            </div>
        </div>
        <div class="legend">
            <div class="item">
                <div class="left">
                    <span class="dot cyan600"></span>
                    <p>Groceries</p>
                </div>
                <span>$ 4,973</span>
            </div>
            <div class="divider"></div>
            <div class="item">
                <div class="left">
                    <span class="dot cyan500"></span>
                    <p>Household</p>
                </div>
                <span>$ 4,973</span>
            </div>
            <div class="divider"></div>
            <div class="item">
                <div class="left">
                    <span class="dot cyan400"></span>
                    <p>Travel</p>
                </div>
                <span>$ 4,973</span>
            </div>
        </div>
    </div>
</body>

</html>
