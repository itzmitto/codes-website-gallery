<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netto Trend &mdash; FinDash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>

  <div class="page-wrapper">
    <div class="section-header">
      <h2>Netto trend</h2>
      <span class="section-tag">6 maanden</span>
    </div>

    <div class="trend-card">
      <div class="chart-card-header">
        <span class="chart-title">Gecombineerd netto overschot per maand</span>
        <div class="legend-row">
          <span class="leg-item">
            <span class="leg-dot"></span>
            Netto
          </span>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="chartTrend"></canvas>
      </div>
    </div>
  </div>

  <script>
    const COLORS = {
      green: '#A3E635',
      muted: '#94A3B8',
      grid: 'rgba(15,23,42,0.06)'
    };

    new Chart(document.getElementById('chartTrend'), {
      type: 'line',
      data: {
        labels: ['Dec', 'Jan', 'Feb', 'Mrt', 'Apr', 'Mei'],
        datasets: [{
          label: 'Netto',
          data: [4800, 4950, 5020, 4780, 5100, 5160],
          borderColor: COLORS.green,
          backgroundColor: 'rgba(163,230,53,0.1)',
          fill: true,
          tension: 0.4,
          pointBackgroundColor: COLORS.green,
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2.5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` €${ctx.parsed.y.toLocaleString('nl-NL')}`
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: COLORS.muted,
              font: { family: 'Plus Jakarta Sans', size: 12 }
            },
            grid: { color: COLORS.grid },
            border: { color: 'transparent' }
          },
          y: {
            min: 4500,
            ticks: {
              color: COLORS.muted,
              font: { family: 'Plus Jakarta Sans', size: 11 },
              callback: v => '€' + v.toLocaleString('nl-NL')
            },
            grid: { color: COLORS.grid },
            border: { color: 'transparent' }
          }
        }
      }
    });
  </script>
</body>
</html>
