<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ab-colors website</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <object class="world-map" type="image/svg+xml" data="world-map.svg"></object>
    <header>
        <div class="logo">Logo</div>
        <nav>
            <a href="#">Destination</a>
            <a href="#">Travel plan</a>
            <a href="#">Inspiration</a>
            <a href="#">Shop</a>
            <a href="#">Blog</a>
        </nav>
        <div class="right-nav">
            <button class="search">Search</button>
            <button class="signin">Sign in</button>
        </div>
    </header>
    <section class="hero">
        <div class="hero-left">
            <h1>Discover the <br>World's <span>Hidden</span><br>Wonders</h1>
            <p>Find the unique moments and hidden gems that ignite unforgettable
                experiences. From rare encounters to remarkable destinations,
                we help you uncover the spark that turns every trip into a cherished story.</p>
            <button class="trip-btn">Plan your trip</button>
        </div>
        <div class="hero-right">
            <div class="big-card"></div>
            <div class="column">
                <div class="small-card top"></div>
                <div class="small-card bottom"></div>
            </div>
        </div>
    </section>
</body>
</html>
