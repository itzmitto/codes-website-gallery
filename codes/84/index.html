<!doctype html>  
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive expand cards</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">
   </head> 
   <body>
      <section class="card">
         <article class="card__article">
            <img src="assets/img-1.png" alt="Beautiful forest landscape" class="card__img">
            <div class="card__shadow"></div>

            <div class="card__data">
               <div class="card__icon">
                  <i class="ri-landscape-fill"></i>
               </div>

               <div class="card__info">
                  <h2 class="card__title">Majestic Fog</h2>
                  <p class="card__description">Beautiful scenery to enjoy</p>
               </div>
            </div>
         </article>

         <article class="card__article">
            <img src="assets/img-2.png" alt="Beautiful forest landscape" class="card__img">
            <div class="card__shadow"></div>
            
            <div class="card__data">
               <div class="card__icon">
                  <i class="ri-landscape-fill"></i>
               </div>

               <div class="card__info">
                  <h2 class="card__title">Autumn Trees</h2>
                  <p class="card__description">Beautiful scenery to enjoy</p>
               </div>
            </div>
         </article>

         <article class="card__article card__active">
            <img src="assets/img-3.png" alt="Beautiful forest landscape" class="card__img">
            <div class="card__shadow"></div>

            <div class="card__data">
               <div class="card__icon">
                  <i class="ri-landscape-fill"></i>
               </div>

               <div class="card__info">
                  <h2 class="card__title">Winter Forest</h2>
                  <p class="card__description">Beautiful scenery to enjoy</p>
               </div>
            </div>
         </article>

         <article class="card__article">
            <img src="assets/img-4.png" alt="Beautiful forest landscape" class="card__img">
            <div class="card__shadow"></div>

            <div class="card__data">
               <div class="card__icon">
                  <i class="ri-landscape-fill"></i>
               </div>

               <div class="card__info">
                  <h2 class="card__title">Hidden Lake</h2>
                  <p class="card__description">Beautiful scenery to enjoy</p>
               </div>
            </div>
         </article>

         <article class="card__article">
            <img src="assets/img-5.png" alt="Beautiful forest landscape" class="card__img">
            <div class="card__shadow"></div>
            
            <div class="card__data">
               <div class="card__icon">
                  <i class="ri-landscape-fill"></i>
               </div>

               <div class="card__info">
                  <h2 class="card__title">Frozen River</h2>
                  <p class="card__description">Beautiful scenery to enjoy</p>
               </div>
            </div>
         </article>
      </section>
   </body>
</html>
