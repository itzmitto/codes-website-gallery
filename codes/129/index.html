<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ab-colors card preview2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h2>Expenses</h2>
        <div class="chart">
            <div class="donut">
                <div class="hole">
                    <span>$ 14,919</span>
                </div>
            </div>
        </div>
        <div class="list">
            <div class="row">
                <div class="left">
                    <span class="dot dot1"></span>
                    <span>Groceries</span>
                </div>
                <div class="amount">$ 4,973</div>
            </div>
            <div class="row">
                <div class="left">
                    <span class="dot dot2"></span>
                    <span>Household</span>
                </div>
                <div class="amount">$ 4,973</div>
            </div>
            <div class="row">
                <div class="left">
                    <span class="dot dot3"></span>
                    <span>Travel</span>
                </div>
                <div class="amount">$ 4,973</div>
            </div>
        </div>
    </div>
</body>
</html>
