<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ab-colors Interactive Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="website loading" id="website">
        <header class="navbar">
            <div class="logo skeleton"></div>
            <nav>
                <a href="#">Shop</a>
                <a href="#">Menu</a>
                <a href="#">Our Story</a>
                <a href="#">Journal</a>
            </nav>
            <button class="store-btn skeleton" id="revealButton">Find a Store</button>
        </header>
        <main class="grid">
            <section class="left">
                <div class="title skeleton"></div>
                <div class="title small skeleton"></div>
                <div class="line skeleton"></div>
                <div class="buttons">
                    <div class="button skeleton"></div>
                    <div class="button skeleton"></div>
                </div>
                <div class="circles">
                    <div class="circle skeleton"></div>
                    <div class="circle skeleton"></div>
                    <div class="circle skeleton"></div>
                    <div class="circle skeleton"></div>
                </div>
                <div class="bottom-row">
                    <div class="card skeleton"></div>
                    <div class="card skeleton"></div>
                    <div class="card skeleton"></div>
                </div>
            </section>
            <section class="right">
                <div class="hero skeleton"></div>
                <div class="cards">
                    <div class="card skeleton"></div>
                    <div class="card skeleton"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
