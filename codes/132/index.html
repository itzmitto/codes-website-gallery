<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweater Weather</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <section class="hero">
        <div class="left">
            <header>
                <div class="logo">
                    <div class="logo-box"></div>

                    <div class="logo-text">
                        <h4>Sweater</h4>
                        <h4>Weather</h4>
                    </div>
                </div>
            </header>
            <div class="hero-content">
                <h1>Talking about coffee, what's your opinion?</h1>
                <p>Is it a social lubricant or a dangerous stimulant?</p>
                <a href="#">Shop now</a>
            </div>
            <nav>
                <a href="#">Coffee</a>
                <a href="#">Tea</a>
                <a href="#">Menu</a>
                <a href="#">Blogs</a>
                <a href="#">Newsletter</a>
            </nav>
        </div>
        <div class="right">
            <svg class="coffee-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
                <defs>
                    <linearGradient id="cupBlack" x1="0" x2="1">
                        <stop offset="0%" stop-color="var(--primary )" />
                        <stop offset="100%" stop-color="var(--primary )" />
                    </linearGradient>

                    <linearGradient id="cupWhite" x1="0" x2="1">
                        <stop offset="0%" stop-color="#f7f7f7" />
                        <stop offset="100%" stop-color="#dadada" />
                    </linearGradient>

                    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".25" />
                    </filter>
                </defs>
                <g transform="translate(390 30) rotate(-18)" filter="url(#shadow)">
                    <ellipse cx="80" cy="30" rx="78" ry="28" fill="var(--primary )" />
                    <ellipse cx="80" cy="30" rx="66" ry="20" fill="var(--primary )" />
                    <circle cx="80" cy="30" r="6" fill="#ddd" />
                    <circle cx="80" cy="30" r="2.5" fill="#666" />
                    <rect x="142" y="25" width="8" height="10" rx="2" fill="var(--primary )" />
                </g>
                <g transform="translate(360 170) rotate(-12)" filter="url(#shadow)">
                    <path d="M30 0 L170 0 L155 270 L45 270 Z" fill="url(#cupBlack)" />
                    <path d="M45 150 L155 150 L145 270 L55 270 Z" fill="url(#cupWhite)" />
                    <ellipse cx="100" cy="0" rx="73" ry="12" fill="var(--primary )" />
                    <ellipse cx="100" cy="0" rx="67" ry="8" fill="var(--primary )" />
                    <text x="100" y="45" font-size="10" fill="#fff" text-anchor="middle" font-family="Arial">
                        SUSTAINABLE BY NATURE
                    </text>
                    <text x="100" y="220" font-size="14" fill="#111" text-anchor="middle" font-family="Arial">
                        Sweater weather
                    </text>
                    <text x="100" y="238" font-size="6" fill="#333" text-anchor="middle" font-family="Arial">
                        ETHICALLY SOURCED
                    </text>
                    <text x="100" y="247" font-size="6" fill="#333" text-anchor="middle" font-family="Arial">
                        SPECIALTY COFFEE
                    </text>
                </g>
                <g transform="translate(620 190) rotate(8)" filter="url(#shadow)">
                    <path d="M30 0 L170 0 L155 270 L45 270 Z" fill="url(#cupBlack)" />
                    <path d="M45 150 L155 150 L145 270 L55 270 Z" fill="url(#cupWhite)" />
                    <ellipse cx="100" cy="0" rx="73" ry="12" fill="var(--primary )" />
                    <ellipse cx="100" cy="0" rx="67" ry="8" fill="var(--primary )" />
                    <text x="100" y="45" font-size="10" fill="#fff" text-anchor="middle" font-family="Arial">
                        GOOD COFFEE, GOOD MOOD
                    </text>
                    <text x="100" y="220" font-size="14" fill="#111" text-anchor="middle" font-family="Arial">
                        Sweater weather
                    </text>
                    <text x="100" y="238" font-size="6" fill="#333" text-anchor="middle" font-family="Arial">
                        ETHICALLY SOURCED
                    </text>
                    <text x="100" y="247" font-size="6" fill="#333" text-anchor="middle" font-family="Arial">
                        SPECIALTY COFFEE
                    </text>
                </g>
            </svg>
        </div>
    </section>
</body>

</html>
