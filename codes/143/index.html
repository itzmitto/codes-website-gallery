<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Sidebar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background"></div>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="window-btns">
                <span class="green"></span>
                <span class="red"></span>
                <span class="yellow"></span>
            </div>
            <div class="logo">
                <button id="toggle">
                    <i class="fa-brands fa-youtube"></i>
                </button>
            </div>
            <div class="line"></div>
            <ul class="mini-menu">
                <li class="active">
                    <i class="fa-solid fa-house"></i>
                </li>
                <li>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </li>
                <li>
                    <i class="fa-regular fa-compass"></i>
                </li>
                <li>
                    <i class="fa-solid fa-photo-film"></i>
                </li>
            </ul>
            <div class="line"></div>
            <ul class="mini-menu">
                <li>
                    <i class="fa-solid fa-circle-info"></i>
                </li>
                <li>
                    <i class="fa-solid fa-gear"></i>
                </li>
                <li>
                    <i class="fa-solid fa-right-from-bracket"></i>
                </li>
            </ul>
            <div class="profile">
                <img src="https://images.unsplash.com/photo-1519575706483-221027bfbb31?q=80&w=2071&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
        </aside>
        <section class="panel">
            <div class="window-btns big">
                <span class="green"></span>
                <span class="red"></span>
                <span class="yellow"></span>
            </div>
            <h1>YouTube</h1>
            <span class="menu-title">
                MENU
            </span>
            <div class="divider"></div>
            <ul class="menu">
                <li class="current">
                    <div>
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </div>
                    <i class="fa-solid fa-angle-right"></i>
                </li>
                <li>
                    <div>
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Explore</span>
                    </div>
                </li>
                <li>
                    <div>
                        <i class="fa-regular fa-compass"></i>
                        <span>Short</span>
                    </div>
                </li>
                <li>
                    <div>
                        <i class="fa-solid fa-photo-film"></i>
                        <span>Subscription</span>
                    </div>
                    <span class="dot"></span>
                </li>
            </ul>
            <div class="divider"></div>
            <ul class="menu secondary">
                <li>
                    <div>
                        <i class="fa-solid fa-circle-info"></i>
                        <span>Information</span>
                    </div>
                </li>
                <li>
                    <div>
                        <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </div>
                </li>
                <li>
                    <div>
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Log out</span>
                    </div>
                </li>
            </ul>
            <div class="divider bottom"></div>
            <div class="account">
                <img src="https://images.unsplash.com/photo-1519575706483-221027bfbb31?q=80&w=2071&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <div>
                    <h3>Hesala hertz</h3>
                    <small>Premium Account</small>
                </div>
                <i class="fa-solid fa-angle-right"></i>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
