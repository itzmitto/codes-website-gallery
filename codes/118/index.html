<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Grid Menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="grid" id="grid">
            <button class="cell active"><i class="fa-solid fa-house"></i></button>
            <button class="cell"><i class="fa-solid fa-user"></i></button>
            <button class="cell"><i class="fa-solid fa-code"></i></button>
            <button class="cell"><i class="fa-solid fa-folder"></i></button>
            <button class="cell"><i class="fa-solid fa-image"></i></button>
            <button class="cell"><i class="fa-solid fa-gamepad"></i></button>
            <button class="cell"><i class="fa-solid fa-music"></i></button>
            <button class="cell"><i class="fa-solid fa-gear"></i></button>
            <button class="cell"><i class="fa-solid fa-envelope"></i></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
